name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code (build_runner)
      run: flutter pub run build_runner build --delete-conflicting-outputs

    # PR 未配置签名密钥时使用 build.gradle 的 debug fallback 完成构建验证；
    # master 发布必须具有完整正式签名，避免误发 debug 签名 APK。
    - name: Configure signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          {
            echo "storeFile=release-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
        elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
          echo "::error::master 发布缺少完整的 KEYSTORE_* GitHub Secrets"
          exit 1
        else
          echo "PR 未配置正式签名，使用 debug signing fallback 验证 APK 构建"
        fi

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Rename APK
      run: cp build/app/outputs/flutter-apk/app-release.apk novel-ide-android.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: novel-ide-android.apk

    # 自动创建/更新 Release 并上传 APK（仅 master 分支 push，非 PR）
    - name: Auto Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "最新版本"
        body: |
          ## 网文写作IDE Android 最新版

          **安装说明**：支持 Android 6.0+，下载 APK 后直接安装即可。
        files: novel-ide-android.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
