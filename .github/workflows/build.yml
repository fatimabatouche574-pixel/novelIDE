name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code (build_runner)
      run: flutter pub run build_runner build --delete-conflicting-outputs

    # 有签名密钥时生成正式签名；无密钥时跳过，build.gradle 会使用 debug 签名产出可安装 APK。
    - name: Decode keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

    - name: Create key.properties
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      run: |
        echo "storeFile=release-key.jks" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      id: build_apk
      run: |
        set +e
        flutter build apk --release --no-tree-shake-icons
        release_status=$?
        set -e

        if [ "$release_status" -eq 0 ] && [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
          src_apk="build/app/outputs/flutter-apk/app-release.apk"
          build_type="release"
        else
          echo "::warning::Release APK build failed; building debug APK as a downloadable fallback."
          flutter build apk --debug --no-tree-shake-icons
          src_apk="build/app/outputs/flutter-apk/app-debug.apk"
          build_type="debug"
        fi

        apk_name="novel-ide-android-${build_type}-${GITHUB_SHA}.apk"
        cp "$src_apk" "$apk_name"
        echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
        echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ steps.build_apk.outputs.build_type }}
        path: ${{ steps.build_apk.outputs.apk_name }}

    # 自动创建/更新 Release 并上传 APK（仅 master 分支 push，非 PR）
    - name: Auto Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.build_apk.outputs.build_type == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "最新版本"
        body: |
          ## 网文写作IDE Android 最新版

          **安装说明**：支持 Android 6.0+，下载 APK 后直接安装即可。
        files: ${{ steps.build_apk.outputs.apk_name }}
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
